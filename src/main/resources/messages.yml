  no-permission: "<prefix><red>権限がありません"
  players-only: "<prefix><red>プレイヤーだけが使えます"
  unknown-player: "<prefix><red>プレイヤー <name> が見つかりません"
  usage: "<prefix><gray>使い方: <usage>"
