  reload-failed: "<prefix><red>読み込みに失敗しました。前の内容のままです: <error>"
  reload-in-match: "<prefix><red>試合中は読み込み直せません"

kitchen:
  created: "<prefix><green>キッチン <id> を作りました"
  exists: "<prefix><red>キッチン <id> はすでにあります"
  not-found: "<prefix><red>キッチン <id> がありません"
